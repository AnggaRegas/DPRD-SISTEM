<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Sistem — Sistem Pengarsipan DPRD Kota Parepare</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-body">
  <div class="login-card-container">
    <div class="login-header-banner">
      <div class="login-emblem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>DPRD KOTA PAREPARE</h1>
      <p>Bagian Fasilitasi Penganggaran & Pengawasan</p>
    </div>

    <div class="login-card-body">
      <div id="alertBox" style="display:none; margin-bottom: 20px; padding: 12px 16px; border-radius: var(--border-radius-md); font-size: 13.5px; background-color: var(--status-danger-bg); color: var(--status-danger); border: 1px solid var(--status-danger-border);"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username" class="form-label">Username Akun <span class="required">*</span></label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Masukkan username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Kata Sandi <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Masukkan kata sandi" required autocomplete="current-password">
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-gold" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 14.5px;">
          <span id="btnText">Masuk ke Sistem</span>
        </button>
      </form>

      <div style="margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border-light); padding-top: 18px;">
        Sistem Pengarsipan Dokumen Resmi &bull; Sekretariat DPRD Kota Parepare<br>
        Akses terproteksi audit keamanan berlapis.
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from './assets/js/api.js';
    import { saveSession, getStoredToken } from './assets/js/auth.js';

    // Jika sudah ada sesi aktif, periksa dan arahkan langsung
    if (getStoredToken()) {
      window.location.replace('dashboard.html');
    }

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showAlert('Username dan kata sandi wajib diisi.');
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = 'Memverifikasi Kredensial...';

      try {
        const res = await api.login(username, password);
        if (res && res.success && res.data && res.data.token) {
          saveSession(res.data.token, res.data.user);

          // Jika wajib ganti password awal
          if (res.data.user && res.data.user.mustChangePassword) {
            window.location.replace('profil.html?wajib_ganti_password=1');
          } else {
            window.location.replace('dashboard.html');
          }
        } else {
          const msg = res && res.message ? res.message : 'Username atau password tidak valid.';
          showAlert(msg);
        }
      } catch (err) {
        showAlert('Layanan autentikasi sedang tidak tersedia. Silakan coba beberapa saat lagi.');
      } finally {
        btnSubmit.disabled = false;
        btnText.textContent = 'Masuk ke Sistem';
      }
    });

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
