<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Sistem — Sistem Pengarsipan DPRD Kota Parepare</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-body">
  <div class="login-card-container">
    <div class="login-header-banner">
      <div class="login-emblem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>DPRD KOTA PAREPARE</h1>
      <p>Bagian Fasilitasi Penganggaran & Pengawasan</p>
    </div>

    <div class="login-card-body">
      <div id="alertBox" style="display:none; margin-bottom: 20px; padding: 12px 16px; border-radius: var(--border-radius-md); font-size: 13.5px; background-color: var(--status-danger-bg); color: var(--status-danger); border: 1px solid var(--status-danger-border);"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username" class="form-label">Username Akun <span class="required">*</span></label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Masukkan username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Kata Sandi <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input type="password" id="password" name="password" class="form-input" placeholder="Masukkan kata sandi" required autocomplete="current-password">
            <button type="button" id="btnTogglePassword" class="password-toggle-btn" aria-label="Tampilkan kata sandi" title="Tampilkan kata sandi">
              <svg id="eyeIconOpen" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeIconClosed" viewBox="0 0 24 24" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-gold" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 14.5px;">
          <span id="btnText">Masuk ke Sistem</span>
        </button>
      </form>

      <div style="margin-top: 16px; text-align: center;">
        <a href="index.html" style="color: var(--navy-800); text-decoration: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
          &larr; Kembali ke Portal Publik Masyarakat
        </a>
      </div>

      <div style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border-light); padding-top: 18px;">
        Sistem Pengarsipan Dokumen Resmi &bull; Sekretariat DPRD Kota Parepare<br>
        Akses terproteksi audit keamanan berlapis.
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from './assets/js/api.js';
    import { saveSession, getStoredToken, clearSession, isSessionExpiredClientSide, getSafeRedirectUrl } from './assets/js/auth.js';

    const params = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('alertBox');
    const form = document.getElementById('loginForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const redirectUrl = params.get('redirect');

    const btnTogglePassword = document.getElementById('btnTogglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIconOpen = document.getElementById('eyeIconOpen');
    const eyeIconClosed = document.getElementById('eyeIconClosed');

    if (btnTogglePassword && passwordInput) {
      btnTogglePassword.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        if (eyeIconOpen) eyeIconOpen.style.display = isPassword ? 'none' : 'block';
        if (eyeIconClosed) eyeIconClosed.style.display = isPassword ? 'block' : 'none';
        btnTogglePassword.setAttribute('aria-label', isPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
        btnTogglePassword.setAttribute('title', isPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
        passwordInput.focus();
      });
    }

    if (params.get('expired') === '1') {
      clearSession();
      showAlert('Sesi Anda telah berakhir atau kedaluwarsa. Silakan masuk kembali.', 'warning');
    } else if (params.get('logout') === '1') {
      clearSession();
      showAlert('Anda telah berhasil keluar dari sistem.', 'info');
    } else if (getStoredToken() && !isSessionExpiredClientSide()) {
      // Jika masih ada sesi aktif yang belum kedaluwarsa, arahkan langsung
      window.location.replace('dashboard.html');
    } else {
      clearSession();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showAlert('Username dan kata sandi wajib diisi.', 'danger');
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = 'Memverifikasi Kredensial...';

      try {
        const res = await api.login(username, password);
        if (res && res.success && res.data && res.data.token) {
          saveSession(res.data.token, res.data.user);

          // Jika wajib ganti password awal
          if (res.data.user && res.data.user.mustChangePassword) {
            window.location.replace('profil.html?wajib_ganti_password=1');
            return;
          }

          // Arahkan ke redirectUrl jika ada dan valid internal
          const destination = getSafeRedirectUrl(redirectUrl, 'dashboard.html');
          window.location.replace(destination);
        } else {
          const msg = res && res.message ? res.message : 'Username atau password tidak valid.';
          const isWarning = res && res.error && (res.error.code === 'TOO_MANY_REQUESTS' || res.error.code === 'ACCOUNT_INACTIVE');
          showAlert(msg, isWarning ? 'warning' : 'danger');
        }
      } catch (err) {
        showAlert('Layanan autentikasi sedang tidak tersedia. Silakan coba beberapa saat lagi.', 'danger');
      } finally {
        btnSubmit.disabled = false;
        btnText.textContent = 'Masuk ke Sistem';
      }
    });

    function showAlert(msg, type = 'danger') {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      if (type === 'warning') {
        alertBox.style.backgroundColor = 'var(--status-warning-bg)';
        alertBox.style.color = 'var(--status-warning)';
        alertBox.style.borderColor = 'rgba(217, 119, 6, 0.25)';
      } else if (type === 'info') {
        alertBox.style.backgroundColor = 'var(--gold-100)';
        alertBox.style.color = 'var(--gold-600)';
        alertBox.style.borderColor = 'var(--gold-border)';
      } else {
        alertBox.style.backgroundColor = 'var(--status-danger-bg)';
        alertBox.style.color = 'var(--status-danger)';
        alertBox.style.borderColor = 'rgba(220, 38, 38, 0.2)';
      }
    }
  </script>
</body>
</html>
