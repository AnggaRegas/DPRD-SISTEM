<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Folder Tahun — Sistem Pengarsipan DPRD Kota Parepare</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="sidebarContainer"></div>

  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header class="top-header">
      <div class="header-left">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka menu navigasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <nav class="breadcrumb-trail" aria-label="Breadcrumb">
          <a href="dashboard.html">Beranda</a>
          <span class="breadcrumb-separator">/</span>
          <a href="arsip_dewan.html">Arsip Dokumen</a>
          <span class="breadcrumb-separator">/</span>
          <a href="#" id="breadcrumbTahunLink">Tahun</a>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-current">Edit Tahun</span>
        </nav>
      </div>
      <div class="header-right">
        <div class="header-badge">
          <span class="header-badge-dot"></span>
          Kelola Tahun
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content" style="max-width: 650px;">
      <div class="page-title-bar">
        <div class="page-title-text">
          <h1>Edit Folder Tahun Arsip</h1>
          <p>Ubah tahun pengelompokan berkas atau hapus folder tahun beserta berkas di dalamnya.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Formulir Perubahan Tahun</h2>
            <p class="card-subtitle">Semua dokumen di bawah tahun ini akan otomatis diperbarui.</p>
          </div>
        </div>
        <div class="card-body">
          <form id="editTahunForm">
            <div class="form-group">
              <label for="inputTahunLama" class="form-label">Tahun Saat Ini</label>
              <input type="text" id="inputTahunLama" class="form-input" readonly style="background: var(--bg-hover); color: var(--navy-500); cursor: not-allowed;">
            </div>

            <div class="form-group">
              <label for="inputTahunBaru" class="form-label">Tahun Baru <span class="required">*</span></label>
              <input type="number" id="inputTahunBaru" class="form-input" min="1900" max="2100" required autofocus>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); flex-wrap: wrap; gap: 12px;">
              <div style="display:flex; gap:10px;">
                <button type="submit" id="btnSubmit" class="btn btn-gold">Simpan Perubahan</button>
                <button type="button" id="btnBatal" class="btn btn-secondary">Batal</button>
              </div>
              <button type="button" id="btnDeleteTahun" class="btn btn-danger">Hapus Tahun</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from './assets/js/api.js';
    import { requireAuth, showToast, showConfirmDialog } from './assets/js/auth.js';
    import { renderSidebar } from './assets/js/sidebar.js';

    const user = requireAuth();
    if (user) {
      renderSidebar('arsip');

      const mobileBtn = document.getElementById('mobileMenuBtn');
      if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
          const sidebar = document.getElementById('sidebar');
          const backdrop = document.getElementById('sidebarBackdrop');
          if (sidebar) sidebar.classList.add('mobile-open');
          if (backdrop) backdrop.classList.add('active');
        });
      }

      const params = new URLSearchParams(window.location.search);
      const dewanId = params.get('dewan_id');
      const kategoriId = params.get('kategori_id');
      const tahun = params.get('tahun');

      if (!dewanId || !kategoriId || !tahun) {
        window.location.replace('arsip_dewan.html');
      }

      const breadcrumbTahunLink = document.getElementById('breadcrumbTahunLink');
      if (breadcrumbTahunLink) {
        breadcrumbTahunLink.href = `dokumen_tahun.html?dewan_id=${dewanId}&kategori_id=${kategoriId}`;
      }

      const form = document.getElementById('editTahunForm');
      const inputTahunLama = document.getElementById('inputTahunLama');
      const inputTahunBaru = document.getElementById('inputTahunBaru');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnDeleteTahun = document.getElementById('btnDeleteTahun');
      const btnBatal = document.getElementById('btnBatal');

      inputTahunLama.value = tahun;
      inputTahunBaru.value = tahun;

      btnBatal.addEventListener('click', () => {
        window.location.replace(`dokumen_tahun.html?dewan_id=${dewanId}&kategori_id=${kategoriId}`);
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const tahunBaru = parseInt(inputTahunBaru.value, 10);
        if (!tahunBaru || isNaN(tahunBaru)) {
          showToast('Tahun baru tidak valid.', 'error');
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Menyimpan...';

        try {
          const res = await api.updateTahun({
            dewan_id: dewanId,
            kategori_id: kategoriId,
            tahun_lama: parseInt(tahun, 10),
            tahun_baru: tahunBaru
          });

          if (res && res.success) {
            showToast('Tahun arsip berhasil diperbarui.', 'success');
            setTimeout(() => {
              window.location.replace(`dokumen_tahun.html?dewan_id=${dewanId}&kategori_id=${kategoriId}`);
            }, 600);
          } else {
            showToast(res.message || 'Gagal memperbarui tahun.', 'error');
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Simpan Perubahan';
          }
        } catch (err) {
          showToast(err.message || 'Terjadi kesalahan sistem.', 'error');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan Perubahan';
        }
      });

      btnDeleteTahun.addEventListener('click', () => {
        showConfirmDialog({
          title: `Hapus Seluruh Arsip Tahun ${tahun}?`,
          message: `PERINGATAN: Menghapus folder tahun ${tahun} akan menghapus seluruh dokumen dan file fisik di Google Drive yang tercakup pada tahun ini. Tindakan ini tidak dapat dibatalkan.`,
          confirmLabel: `Hapus Tahun ${tahun}`,
          danger: true,
          onConfirm: async () => {
            btnDeleteTahun.disabled = true;
            btnDeleteTahun.textContent = 'Menghapus...';
            try {
              const res = await api.deleteTahun(dewanId, kategoriId, tahun);
              if (res && res.success) {
                showToast(`Folder tahun ${tahun} berhasil dihapus.`, 'success');
                setTimeout(() => {
                  window.location.replace(`dokumen_tahun.html?dewan_id=${dewanId}&kategori_id=${kategoriId}`);
                }, 600);
              } else {
                showToast(res.message || 'Gagal menghapus tahun.', 'error');
                btnDeleteTahun.disabled = false;
                btnDeleteTahun.textContent = 'Hapus Tahun';
              }
            } catch (e) {
              showToast(e.message || 'Gagal menghapus tahun.', 'error');
              btnDeleteTahun.disabled = false;
              btnDeleteTahun.textContent = 'Hapus Tahun';
            }
          }
        });
      });
    }
  </script>
</body>
</html>
