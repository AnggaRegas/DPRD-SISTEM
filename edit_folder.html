<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Folder Dokumen — Sistem Pengarsipan DPRD Kota Parepare</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="sidebarContainer"></div>

  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header class="top-header">
      <div class="header-left">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka menu navigasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <nav class="breadcrumb-trail" aria-label="Breadcrumb">
          <a href="dashboard.html">Beranda</a>
          <span class="breadcrumb-separator">/</span>
          <a href="arsip_dewan.html">Arsip Dokumen</a>
          <span class="breadcrumb-separator">/</span>
          <a href="#" id="breadcrumbFolderLink">Folder</a>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-current">Edit Folder</span>
        </nav>
      </div>
      <div class="header-right">
        <div class="header-badge">
          <span class="header-badge-dot"></span>
          Kelola Folder
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content" style="max-width: 650px;">
      <div class="page-title-bar">
        <div class="page-title-text">
          <h1>Edit Folder Dokumen</h1>
          <p>Ubah nama folder atau hapus folder kosong yang tidak lagi digunakan.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Formulir Perubahan Folder</h2>
            <p class="card-subtitle">Nama folder baru akan diterapkan pada seluruh dokumen terkait.</p>
          </div>
        </div>
        <div class="card-body">
          <form id="editFolderForm">
            <div class="form-group">
              <label for="inputFolderLama" class="form-label">Nama Folder Saat Ini</label>
              <input type="text" id="inputFolderLama" class="form-input" readonly style="background: var(--bg-hover); color: var(--navy-500); cursor: not-allowed;">
            </div>

            <div class="form-group">
              <label for="inputFolderBaru" class="form-label">Nama Folder Baru <span class="required">*</span></label>
              <input type="text" id="inputFolderBaru" class="form-input" required autofocus>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); flex-wrap: wrap; gap: 12px;">
              <div style="display:flex; gap:10px;">
                <button type="submit" id="btnSubmit" class="btn btn-gold">Simpan Perubahan</button>
                <button type="button" id="btnBatal" class="btn btn-secondary">Batal</button>
              </div>
              <button type="button" id="btnDeleteFolder" class="btn btn-danger">Hapus Folder</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from './assets/js/api.js';
    import { requireAuth, showToast, showConfirmDialog } from './assets/js/auth.js';
    import { renderSidebar } from './assets/js/sidebar.js';

    const user = requireAuth();
    if (user) {
      renderSidebar('arsip');

      const mobileBtn = document.getElementById('mobileMenuBtn');
      if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
          const sidebar = document.getElementById('sidebar');
          const backdrop = document.getElementById('sidebarBackdrop');
          if (sidebar) sidebar.classList.add('mobile-open');
          if (backdrop) backdrop.classList.add('active');
        });
      }

      const params = new URLSearchParams(window.location.search);
      const dewanId = params.get('dewan_id');
      const kategoriId = params.get('kategori_id');
      const tahun = params.get('tahun');
      const namaFolder = params.get('nama_folder');

      if (!dewanId || !kategoriId || !tahun || !namaFolder) {
        window.location.replace('arsip_dewan.html');
      }

      const returnUrl = `dokumen_folder.html?dewan_id=${dewanId}&kategori_id=${kategoriId}&tahun=${tahun}`;
      const breadcrumbFolderLink = document.getElementById('breadcrumbFolderLink');
      if (breadcrumbFolderLink) {
        breadcrumbFolderLink.href = returnUrl;
      }

      const form = document.getElementById('editFolderForm');
      const inputFolderLama = document.getElementById('inputFolderLama');
      const inputFolderBaru = document.getElementById('inputFolderBaru');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnDeleteFolder = document.getElementById('btnDeleteFolder');
      const btnBatal = document.getElementById('btnBatal');

      inputFolderLama.value = namaFolder;
      inputFolderBaru.value = namaFolder;

      btnBatal.addEventListener('click', () => {
        window.location.replace(returnUrl);
      });

      let isSubmitting = false;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;
        const folderBaru = inputFolderBaru.value.trim();
        if (!folderBaru) {
          showToast('Nama folder baru tidak boleh kosong.', 'error');
          return;
        }

        isSubmitting = true;
        if (!folderBaru) {
          showToast('Nama folder baru tidak boleh kosong.', 'error');
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Menyimpan...';

        try {
          const res = await api.updateFolder({
            dewan_id: dewanId,
            kategori_id: kategoriId,
            tahun: parseInt(tahun, 10),
            folder_lama: namaFolder,
            folder_baru: folderBaru
          });

          if (res && res.success) {
            showToast('Nama folder berhasil diperbarui.', 'success');
            setTimeout(() => {
              window.location.replace(returnUrl);
            }, 600);
          } else {
            showToast(res.message || 'Gagal memperbarui folder.', 'error');
            isSubmitting = false;
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Simpan Perubahan';
          }
        } catch (err) {
          showToast(err.message || 'Terjadi kesalahan sistem.', 'error');
          isSubmitting = false;
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan Perubahan';
        }
      });

      let isDeleting = false;
      btnDeleteFolder.addEventListener('click', () => {
        if (isDeleting) return;
        showConfirmDialog({
          title: `Hapus Folder "${namaFolder}"?`,
          message: `Folder hanya dapat dihapus jika sudah kosong tanpa berkas dokumen aktif. Apakah Anda yakin ingin menghapus folder ini?`,
          confirmLabel: 'Hapus Folder',
          danger: true,
          onConfirm: async () => {
            isDeleting = true;
            btnDeleteFolder.disabled = true;
            btnDeleteFolder.textContent = 'Menghapus...';
            try {
              const res = await api.deleteFolder({
                dewan_id: dewanId,
                kategori_id: kategoriId,
                tahun: parseInt(tahun, 10),
                nama_folder: namaFolder
              });
              if (res && res.success) {
                showToast(`Folder "${namaFolder}" berhasil dihapus.`, 'success');
                setTimeout(() => {
                  window.location.replace(returnUrl);
                }, 600);
              } else {
                showToast(res.message || 'Gagal menghapus folder.', 'error');
                isDeleting = false;
                btnDeleteFolder.disabled = false;
                btnDeleteFolder.textContent = 'Hapus Folder';
              }
            } catch (e) {
              showToast(e.message || 'Gagal menghapus folder.', 'error');
              isDeleting = false;
              btnDeleteFolder.disabled = false;
              btnDeleteFolder.textContent = 'Hapus Folder';
            }
          }
        });
      });
    }
  </script>
</body>
</html>
