<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Kategori - Sistem Pengarsipan DPRD</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #334155;
    }
    .main-content {
      margin-left: 250px;
      min-height: 100vh;
      background: #f5f7fb;
      transition: margin-left .25s ease;
    }
    .main-content.sidebar-collapsed { margin-left: 78px; }
    .page-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 26px 24px;
    }
    .page-header { margin-bottom: 24px; }
    .page-header h1 {
      margin: 0 0 8px;
      color: #172554;
      font-size: 24px;
      font-weight: 700;
    }
    @media (max-width: 650px) {
      .main-content { margin-left: 78px; }
      .page-container { padding: 20px 14px; }
    }
  </style>
</head>
<body>
  <div id="sidebarContainer"></div>

  <main class="main-content" id="mainContent">
    <div class="page-container">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="dashboard.html">Dashboard</a>
          <span>/</span>
          <a href="dewan.html">Anggota Dewan</a>
          <span>/</span>
          <span>Tambah Kategori</span>
        </div>
        <h1>Tambah Kategori Dokumen</h1>
        <p>Tambahkan kategori pengarsipan baru untuk mengelompokkan dokumen DPRD.</p>
      </div>

      <div class="form-box">
        <div id="alertBox" style="display:none;" class="alert-banner error"></div>

        <form id="tambahKatForm">
          <div class="form-group">
            <label for="inputNamaKategori">Nama Kategori Dokumen <span class="required">*</span></label>
            <input type="text" id="inputNamaKategori" placeholder="Contoh: Laporan Kunjungan Kerja Komisi" required autofocus>
          </div>

          <div class="form-actions">
            <button type="submit" id="btnSubmit" class="btn btn-primary">Simpan Kategori</button>
            <button type="button" onclick="window.history.back()" class="btn btn-reset">Batal</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderSidebar } from './assets/js/sidebar.js';
    import { api } from './assets/js/api.js';

    requireAuth();
    renderSidebar('dewan');

    const params = new URLSearchParams(window.location.search);
    const dewanId = params.get('dewan_id');

    const form = document.getElementById('tambahKatForm');
    const inputNama = document.getElementById('inputNamaKategori');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const nama = inputNama.value.trim();
      if (!nama) {
        alertBox.textContent = 'Nama kategori wajib diisi.';
        alertBox.style.display = 'flex';
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menyimpan...';

      try {
        const res = await api.createKategori(nama);
        if (res && res.success) {
          if (dewanId) {
            window.location.replace(`arsip_dewan.html?id=${dewanId}`);
          } else {
            window.location.replace('dewan.html');
          }
        } else {
          alertBox.textContent = res.message || 'Gagal menambahkan kategori.';
          alertBox.style.display = 'flex';
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan Kategori';
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Terjadi kesalahan.';
        alertBox.style.display = 'flex';
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Simpan Kategori';
      }
    });
  </script>
</body>
</html>
