<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Anggota DPRD — Sistem Pengarsipan DPRD Kota Parepare</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="sidebarContainer"></div>

  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header class="top-header">
      <div class="header-left">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka menu navigasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <nav class="breadcrumb-trail" aria-label="Breadcrumb">
          <a href="dashboard.html">Beranda</a>
          <span class="breadcrumb-separator">/</span>
          <a href="dewan.html">Anggota DPRD</a>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-current">Tambah Dewan</span>
        </nav>
      </div>
      <div class="header-right">
        <div class="header-badge">
          <span class="header-badge-dot"></span>
          Master Data
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content" style="max-width: 800px;">
      <div class="page-title-bar">
        <div class="page-title-text">
          <h1>Tambah Anggota DPRD Baru</h1>
          <p>Masukkan identitas dewan resmi untuk menghubungkan arsip dokumen kedewanan.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Formulir Identitas Anggota Dewan</h2>
            <p class="card-subtitle">Lengkapi nama lengkap beserta gelar, jabatan, dan fraksi.</p>
          </div>
        </div>
        <div class="card-body">
          <form id="tambahDewanForm">
            <div class="form-group">
              <label for="inputNama" class="form-label">Nama Lengkap & Gelar <span class="required">*</span></label>
              <input type="text" id="inputNama" class="form-input" placeholder="Contoh: Ir. H. KAHARUDDIN KADIR, M.Si." required autofocus>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label for="inputJabatan" class="form-label">Jabatan di DPRD <span class="required">*</span></label>
                <input type="text" id="inputJabatan" class="form-input" placeholder="Contoh: Ketua DPRD / Anggota" value="Anggota" required>
              </div>

              <div class="form-group">
                <label for="inputPeriode" class="form-label">Periode Masa Jabatan <span class="required">*</span></label>
                <input type="text" id="inputPeriode" class="form-input" value="2024 - 2029" required>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label for="inputPartai" class="form-label">Partai Politik / Fraksi <span class="required">*</span></label>
                <input type="text" id="inputPartai" class="form-input" placeholder="Contoh: Partai Golongan Karya" required>
              </div>

              <div class="form-group">
                <label for="inputPendamping" class="form-label">Nama Staf Pendamping</label>
                <input type="text" id="inputPendamping" class="form-input" placeholder="Nama staf pendamping dewan">
              </div>
            </div>

            <div class="form-group">
              <label for="inputKecamatan" class="form-label">Kecamatan Asal (Dapil / Domisili) <span class="required">*</span></label>
              <select id="inputKecamatan" class="form-select" required>
                <option value="">-- Pilih Kecamatan di Kota Parepare --</option>
                <option value="Kecamatan Bacukiki">Kecamatan Bacukiki</option>
                <option value="Kecamatan Bacukiki Barat">Kecamatan Bacukiki Barat</option>
                <option value="Kecamatan Soreang">Kecamatan Soreang</option>
                <option value="Kecamatan Ujung">Kecamatan Ujung</option>
              </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light);">
              <a href="dewan.html" class="btn btn-secondary">Batal</a>
              <button type="submit" class="btn btn-gold" id="btnSubmit">Simpan Anggota Dewan</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from './assets/js/api.js';
    import { requireAuth, showToast } from './assets/js/auth.js';
    import { renderSidebar } from './assets/js/sidebar.js';

    const user = requireAuth();
    if (user) {
      if (user.role === 'staff') {
        showToast('Akses ditolak: Staf pendamping tidak memiliki izin menambah anggota dewan.', 'error');
        window.location.replace('dewan.html');
      }

      renderSidebar('dewan');

      const mobileBtn = document.getElementById('mobileMenuBtn');
      if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
          const sidebar = document.getElementById('sidebar');
          const backdrop = document.getElementById('sidebarBackdrop');
          if (sidebar) sidebar.classList.add('mobile-open');
          if (backdrop) backdrop.classList.add('active');
        });
      }

      const form = document.getElementById('tambahDewanForm');
      const btnSubmit = document.getElementById('btnSubmit');

      let isSubmitting = false;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;
        const nama = document.getElementById('inputNama').value.trim();
        const jabatan = document.getElementById('inputJabatan').value.trim();
        const periode = document.getElementById('inputPeriode').value.trim();
        const partai = document.getElementById('inputPartai').value.trim();
        const pendamping = document.getElementById('inputPendamping').value.trim();
        const kecamatan = document.getElementById('inputKecamatan').value.trim();

        if (!nama || !jabatan || !partai || !kecamatan) {
          showToast('Harap lengkapi kolom yang wajib diisi (*).', 'warning');
          return;
        }

        isSubmitting = true;
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Menyimpan...';

        try {
          const res = await api.createDewan({
            nama: nama,
            jabatan: jabatan,
            periode: periode,
            nama_partai: partai,
            nama_pendamping: pendamping,
            kecamatan: kecamatan
          });

          if (res && res.success) {
            showToast('Anggota dewan berhasil ditambahkan!', 'success');
            setTimeout(() => {
              window.location.replace('dewan.html');
            }, 800);
          } else {
            showToast(res.message || 'Gagal menambahkan anggota dewan.', 'error');
            isSubmitting = false;
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Simpan Anggota Dewan';
          }
        } catch (err) {
          showToast(err.message || 'Terjadi kesalahan sistem.', 'error');
          isSubmitting = false;
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan Anggota Dewan';
        }
      });
    }
  </script>
</body>
</html>
